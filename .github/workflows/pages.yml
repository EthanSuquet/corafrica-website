name: Deploy to GitHub Pages

# Publishes site/ to corafrica.org.ng on every push to main.
#
# The site went live here on 2026-09-25. Until then this was a staging URL, and a
# noindex tag was injected at deploy time so it could not compete with the old
# WordPress site in search. That step is gone: the source was always
# production-ready, so nothing else changed at launch.
#
# The custom domain is set in the repository's Pages settings, not by a CNAME
# file: with an Actions deploy, GitHub ignores the file and reads the setting.
# DNS lives in the WhoGoHost cPanel. The apex has four A records to GitHub, www
# is a CNAME to ethansuquet.github.io, and mail stays on the cPanel server
# through its own A record, mail.corafrica.org.ng, which the MX points at.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
